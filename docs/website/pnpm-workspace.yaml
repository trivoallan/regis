# Standalone pnpm project (not a multi-package workspace).
# pnpm 11 reads project settings — including `overrides` and build-script
# approvals — from here, not from the "pnpm" field in package.json (ignored).
# The serialize-javascript and webpack caps live here so lockfile regens honor them.
overrides:
  serialize-javascript: ^7.0.5
  webpack: <5.108.0
allowBuilds:
  core-js: true
  core-js-pure: true
