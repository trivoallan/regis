[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=10.0.5"]
build-backend = "setuptools.build_meta"

[project]
name = "regis"
version = "0.37.0"
description = "Container Security & Policy-as-Code Orchestration. Unified analysis, custom playbooks, and highly customizable interactive reports for production-ready CI/CD."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Tristan Rivoallan" }]
dependencies = [
  "click>=8.1",
  "requests>=2.32.2",
  "jsonschema>=4.20",
  "semver>=3.0",
  "json-logic-qubit>=0.9",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "cookiecutter>=2.5",
  "referencing>=0.28.4",
  "ruamel.yaml>=0.18",
]

[project.scripts]
regis = "regis.cli:main"

[project.entry-points."regis.analyzers"]
versioning = "regis.analyzers.versioning:VersioningAnalyzer"
scorecarddev = "regis.analyzers.scorecarddev:ScorecardDevAnalyzer"
oci = "regis.analyzers.oci:OciAnalyzer"
cve = "regis.analyzers.cve:CveAnalyzer"
endoflife = "regis.analyzers.endoflife:EndOfLifeAnalyzer"
popularity = "regis.analyzers.popularity:PopularityAnalyzer"
size = "regis.analyzers.size:SizeAnalyzer"
freshness = "regis.analyzers.freshness:FreshnessAnalyzer"
provenance = "regis.analyzers.provenance:ProvenanceAnalyzer"
sbom = "regis.analyzers.sbom:SbomAnalyzer"
hadolint = "regis.analyzers.hadolint:HadolintAnalyzer"
dockle = "regis.analyzers.dockle:DockleAnalyzer"
metadata = "regis.analyzers.metadata:MetadataAnalyzer"
secrets = "regis.analyzers.secrets:SecretsAnalyzer"

[dependency-groups]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "responses>=0.24",
  "genbadge[coverage]>=1.1",
  "httpx>=0.28",
  "ruff",
  "jsonschema2md",
  "json-schema-for-humans",
  "types-PyYAML",
  "types-requests",
  "types-jsonschema",
]

[tool.uv]
# Transitive security floors carried over from the former Pipfile. They only
# apply when a dependency actually pulls the package (some, like chardet, are
# dormant guards today).
constraint-dependencies = [
  "urllib3>=2.7.0",
  "idna>=3.15",
  "pillow>=12.2.0",
  "chardet>=5.0.0",
  "charset-normalizer>=2.0.0",
]

[tool.setuptools.packages.find]
include = ["regis*"]

[tool.setuptools.package-data]
regis = [
  "schemas/**/*",
  "scorecard/*.yaml",
  "templates/**/*",
  "cookiecutters/**/*",
  "playbooks/**/*",
  "data/*.json",
]
"regis.tools" = ["manifest.yaml"]

[tool.setuptools_scm]
# Enable setuptools_scm, though version is manually set to 0.20.0 for now.
# This avoids build-time errors when setuptools_scm is in build-system requirements.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=regis --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=90"

[tool.coverage.run]
source = ["regis"]
omit = ["regis/cookiecutters/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml.*", "requests.*", "json_logic.*", "referencing.*"]
ignore_missing_imports = true

# Workaround for a mypy 1.19.1 internal AssertionError when trunk lints
# downstream importers in isolation. follow_imports=skip avoids the
# cross-ref lookup that crashes, without silencing type errors in the
# module itself (which is still checked when targeted directly).
# regis.analyzers.base is included because it imports the stdlib `warnings`
# module (added for the default_rules deprecation shim), which trips the same
# cross-ref AssertionError when downstream analyzer modules are linted alone.
# regis.utils.predicates is included because it is imported by metadata.py and
# evaluator.py (and reached transitively from analyze.py via the report engine),
# which triggers the same cross-ref AssertionError when those importers are
# linted in isolation.
[[tool.mypy.overrides]]
module = [
  "regis.playbook.schema_registry",
  "regis.analyzers.base",
  "regis.utils.predicates",
]
follow_imports = "skip"
