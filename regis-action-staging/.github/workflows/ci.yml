name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install yamllint
        run: pipx install yamllint==1.35.1

      - name: yamllint action.yml
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" action.yml

      - name: Download actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7

      - name: Run actionlint
        run: ./actionlint -color

  dogfood:
    name: Self-test (analyze regis image)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Analyze ghcr.io/trivoallan/regis:latest
        uses: ./
        with:
          image-url: ghcr.io/trivoallan/regis:latest
          version: latest
          upload-artifact: "false"
