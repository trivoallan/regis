name: Release / Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.REGIS_CI_APP_ID }}
          private-key: ${{ secrets.REGIS_CI_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Checkout PR branch
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ fromJson(steps.release.outputs.pr).headBranchName }}
          token: ${{ steps.generate-token.outputs.token }}

      - name: Install uv
        if: ${{ steps.release.outputs.pr }}
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Sync uv.lock to the released version
        if: ${{ steps.release.outputs.pr }}
        run: |
          # release-please bumps the version in pyproject.toml but leaves uv.lock,
          # which pins the project's own version, untouched. That desyncs the
          # lockfile and fails every `uv ... --locked` step (pytest, pip-audit,
          # image build) on the release PR. Re-lock only the `regis` package so
          # no dependencies are upgraded as a side effect.
          uv lock --upgrade-package regis
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add uv.lock
          git commit -m "build(deps): sync uv.lock to the released version" || echo "No changes to commit"
          git push

      - name: Install Trunk
        if: ${{ steps.release.outputs.pr }}
        uses: trunk-io/trunk-action/install@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1.3.1

      - name: Format CHANGELOG.md
        if: ${{ steps.release.outputs.pr }}
        run: |
          trunk fmt CHANGELOG.md
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add CHANGELOG.md
          git commit -m "style(changelog): run trunk fmt on CHANGELOG.md" || echo "No changes to commit"
          git push
