name: CI / Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: generate-token
        continue-on-error: true
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.REGIS_CI_APP_ID }}
          private-key: ${{ secrets.REGIS_CI_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.generate-token.outputs.token || github.token }}

      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Run pip-audit (HIGH/CRITICAL gate)
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes -o requirements-ci.txt
          set +e
          # --python 3.13: align the audit env with the project pin so the
          # export's environment markers are evaluated consistently.
          uvx --python 3.13 pip-audit -r requirements-ci.txt --format=json --output pip-audit-report.json
          audit_exit_code=$?
          set -e
          if [ ! -s pip-audit-report.json ]; then
            echo "pip-audit did not produce JSON output"
            exit 1
          fi
          python3 scripts/enforce_pip_audit_severity.py pip-audit-report.json --min-severity HIGH
          if [ "$audit_exit_code" -ne 0 ]; then
            echo "pip-audit reported vulnerabilities; severity gate applied above"
          fi

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 14
          if-no-files-found: warn
