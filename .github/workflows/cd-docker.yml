name: CD / Docker

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Coalesce rapid main pushes into a single build (cancel the in-flight one).
# Tag/release builds get a per-ref group and are never cancelled.
concurrency:
  group: cd-docker-${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      # contents: write is required so anchore/sbom-action can attach the
      # generated SBOMs to the GitHub Release on tag builds. With contents:read
      # that attach step fails ("Resource not accessible by integration") and
      # releases ship without SBOM assets (regressed silently since v0.30.0).
      contents: write
      packages: write
      attestations: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        variant: [slim, full]

    steps:
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.REGIS_CI_APP_ID }}
          private-key: ${{ secrets.REGIS_CI_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to the Container registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # For the full variant, suffix every tag (including :latest) with
          # -full so :latest stays bound to the slim image. Slim publishes the
          # plain tags plus a :latest-slim alias on tag pushes.
          flavor: |
            suffix=${{ matrix.variant == 'full' && '-full' || '' }},onlatest=true
          # Per-commit `sha-<short>` tags are emitted on tag builds only. On
          # `main` pushes they accumulate one (×2 variants) per commit on the
          # GHCR versions page with no cleanup, so the floating `main` tag plus
          # the immutable `@sha256:` digest carry traceability there instead.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest-slim,enable=${{ matrix.variant == 'slim' && github.ref_type == 'tag' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VARIANT=${{ matrix.variant }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Measure published image size
        id: size
        if: matrix.variant == 'slim'
        run: |
          ref="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          docker pull --quiet "$ref"
          bytes=$(docker image inspect "$ref" --format='{{.Size}}')
          mb=$(( (bytes + 1048575) / 1048576 ))
          echo "Measured ${mb} MB (${bytes} bytes) for ${ref}"
          echo "mb=${mb}" >> "$GITHUB_OUTPUT"

      - name: Regenerate image-size badge
        if: matrix.variant == 'slim'
        run: |
          mb=${{ steps.size.outputs.mb }}
          if   [ "$mb" -lt 250 ]; then color=brightgreen
          elif [ "$mb" -lt 350 ]; then color=green
          elif [ "$mb" -lt 450 ]; then color=yellow
          else                         color=red
          fi
          curl -sSL --fail "https://img.shields.io/badge/image%20size-${mb}%20MB-${color}.svg" \
            -o image-size-badge.svg

      - name: Create pull request for image-size badge update
        if: matrix.variant == 'slim'
        continue-on-error: true
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: "docs: refresh published image-size badge"
          author: regis-ci[bot] <regis-ci[bot]@users.noreply.github.com>
          branch: docs/image-size-badge
          delete-branch: true
          title: "docs: refresh published image-size badge"
          body: |
            Automated update of `image-size-badge.svg` after publishing a new Docker image.

            Measured size: **${{ steps.size.outputs.mb }} MB** (extracted on-disk on overlay2).
          add-paths: image-size-badge.svg

      - name: Generate CycloneDX SBOM
        if: github.ref_type == 'tag'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Generate SPDX SBOM
        if: github.ref_type == 'tag'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM release artifacts
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.ref_name }}-${{ matrix.variant }}
          path: |
            sbom.cyclonedx.json
            sbom.spdx.json

      - name: Attest Docker image provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
