name: CD / Docker

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Coalesce rapid main pushes into a single build (cancel the in-flight one).
# Tag/release builds get a per-ref group and are never cancelled.
concurrency:
  group: cd-docker-${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      # contents: write is required so anchore/sbom-action can attach the
      # generated SBOMs to the GitHub Release on tag builds. With contents:read
      # that attach step fails ("Resource not accessible by integration") and
      # releases ship without SBOM assets (regressed silently since v0.30.0).
      contents: write
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.REGIS_CI_APP_ID }}
          private-key: ${{ secrets.REGIS_CI_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to the Container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Measure published image size
        id: size
        run: |
          ref="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          docker pull --quiet "$ref"
          bytes=$(docker image inspect "$ref" --format='{{.Size}}')
          mb=$(( (bytes + 1048575) / 1048576 ))
          echo "Measured ${mb} MB (${bytes} bytes) for ${ref}"
          echo "mb=${mb}" >> "$GITHUB_OUTPUT"

      - name: Regenerate image-size badge
        run: |
          mb=${{ steps.size.outputs.mb }}
          if   [ "$mb" -lt 250 ]; then color=brightgreen
          elif [ "$mb" -lt 350 ]; then color=green
          elif [ "$mb" -lt 450 ]; then color=yellow
          else                         color=red
          fi
          curl -sSL --fail "https://img.shields.io/badge/image%20size-${mb}%20MB-${color}.svg" \
            -o image-size-badge.svg

      - name: Create pull request for image-size badge update
        continue-on-error: true
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: "docs: refresh published image-size badge"
          author: regis-ci[bot] <regis-ci[bot]@users.noreply.github.com>
          branch: docs/image-size-badge
          delete-branch: true
          title: "docs: refresh published image-size badge"
          body: |
            Automated update of `image-size-badge.svg` after publishing a new Docker image.

            Measured size: **${{ steps.size.outputs.mb }} MB** (extracted on-disk on overlay2).
          add-paths: image-size-badge.svg

      - name: Generate CycloneDX SBOM
        if: github.ref_type == 'tag'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Generate SPDX SBOM
        if: github.ref_type == 'tag'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM release artifacts
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.ref_name }}
          path: |
            sbom.cyclonedx.json
            sbom.spdx.json

      - name: Attest Docker image provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
