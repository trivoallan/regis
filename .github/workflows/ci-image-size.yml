name: CI / Image Size

# Per-variant ceilings. See docs/superpowers/specs/2026-05-31-image-size-round-3-design.md
# for the size breakdown rationale.

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - Pipfile
      - Pipfile.lock
      - .github/workflows/ci-image-size.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  image-size:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: slim
            ceiling: 200MB
          - variant: full
            ceiling: 520MB
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build image (${{ matrix.variant }})
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          load: true
          tags: regis:size-check-${{ matrix.variant }}
          build-args: |
            VARIANT=${{ matrix.variant }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Enforce size limit (${{ matrix.variant }} ≤ ${{ matrix.ceiling }})
        uses: wemake-services/docker-image-size-limit@f5970eb0c2180ac296475bfd22c5a58955370051 # 2.2.0
        with:
          image: regis:size-check-${{ matrix.variant }}
          size: ${{ matrix.ceiling }}
          show_current_size: true
